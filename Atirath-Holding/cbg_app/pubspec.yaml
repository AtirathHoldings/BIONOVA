name: cbg_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^5.1.0
  http: ^1.2.1
  intl: ^0.20.2  # ✅ Added this line

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  month_picker_dialog: ^6.7.2
  fl_chart: ^0.70.0
  linked_scroll_controller: ^0.2.0
  image_picker: ^1.0.7
  shared_preferences: ^2.3.5
  flutter_local_notifications: ^22.0.1
  workmanager: ^0.9.0+3
  file_picker: ^11.0.2
  http_parser: ^4.0.2
  app_links: ^7.0.0
  url_launcher: ^6.3.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/image.webp
    - assets/BioNova.webp
    - assets/company.webp
    - assets/Bionova_Logo.webp
    - .env
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/BioNova.webp"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/BioNova.webp
  android: true
  ios: true
